<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fábrica de Produtos Digitais</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;min-height:100vh;padding:16px}
.container{max-width:440px;margin:0 auto}
.badge{display:inline-block;background:#facc15;color:#000;font-weight:900;font-size:10px;padding:6px 10px;border-radius:6px;margin-bottom:8px}
.tag{display:inline-block;background:#facc15;color:#000;font-weight:900;font-size:10px;padding:5px 12px;border-radius:999px;margin-bottom:10px}
h1{font-size:30px;font-weight:900;line-height:0.92;letter-spacing:-1px;margin:8px 0 12px}
h1 span{color:#facc15}
.sub{color:#a1a1aa;font-size:13px;margin-bottom:14px;line-height:1.4}
.sub strong{color:#fff}
.search-wrap{position:sticky;top:10px;z-index:10;background:#0a0a0a;padding:8px 0 12px}
.search{width:100%;background:#141414;border:1px solid #232323;border-radius:999px;padding:12px 16px;color:#fff;font-size:13px;outline:none}
.search:focus{border-color:#facc15}
.search::placeholder{color:#52525b}
.count{color:#71717a;font-size:11px;margin:8px 2px 0;display:flex;justify-content:space-between}
.products{display:flex;flex-direction:column;gap:12px;margin-top:10px}
.card{background:#141414;border:1px solid #232323;border-radius:18px;padding:16px;animation:fade .2s}
@keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:translateY(0)}}
.meta{display:flex;justify-content:space-between;gap:10px;margin-bottom:6px}
.card h3{font-size:14px;font-weight:800;line-height:1.25;flex:1}
.price{border:1.5px solid #facc15;color:#facc15;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px;white-space:nowrap;height:fit-content}
.desc{color:#a1a1aa;font-size:12px;line-height:1.4;margin:8px 0 12px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.btn{display:block;width:100%;background:#facc15;color:#000;text-align:center;font-weight:900;font-size:13px;padding:13px;border-radius:999px;text-decoration:none}
.btn-more{width:100%;background:transparent;border:1px solid #27272a;color:#fff;padding:12px;border-radius:999px;font-weight:700;font-size:13px;margin-top:14px;cursor:pointer}
.btn-more:hover{border-color:#facc15;color:#facc15}
.footer{text-align:center;margin-top:24px;color:#52525b;font-size:10px}
</style>
</head>
<body>
<div class="container">
<div class="badge">FPD</div>
<div class="tag">TODOS EM PDF IMEDIATO</div>
<h1>FÁBRICA DE<br><span>PRODUTOS</span> DIGITAIS</h1>
<p class="sub"><strong>Escolha seu guia abaixo 👇</strong><br>Todos em PDF imediato, entrega na hora.</p>

<div class="search-wrap">
<input id="busca" class="search" placeholder="🔍 Buscar: finanças, receitas, foco, ansiedade...">
<div class="count"><span id="contador">Carregando...</span><span id="contadorFiltro"></span></div>
</div>

<div id="lista" class="products"></div>
<button id="verMais" class="btn-more" style="display:none">Ver mais 20 ▼</button>

<div class="footer">Pagamento seguro via Cakto • Entrega instantânea em PDF<br><br><span style="background:#facc15;color:#000;font-weight:900;padding:3px 7px;border-radius:5px">FPD</span> <strong style="color:#fff">FÁBRICA DE PRODUTOS DIGITAIS</strong></div>
</div>
<script>
let TODOS = [];
let FILTRADOS = [];
let MOSTRADOS = 20;
const POR_PAGINA = 20;

async function carregar(){
  try{
    const r = await fetch('./catalogo/catalogo.json?v='+Date.now());
    const data = await r.json();
    let prods = [];
    if(Array.isArray(data)) prods = data;
    else if(data.produtos) prods = data.produtos;
    else if(data.pacotes) prods = data.pacotes;
    prods = prods.filter(p=>p && (p.nome||p.titulo) && (!p.status || p.status==='pronto') && /^https:\/\/pay\.cakto\.com\.br\/.+/.test(p.link_compra||p.link||''));
    prods.sort((a,b)=> new Date(b.criado_em||0) - new Date(a.criado_em||0));
    TODOS = prods;
    FILTRADOS = prods;
    document.getElementById('contador').textContent = TODOS.length + ' guias no catálogo';
    render(true);
  }catch(e){
    document.getElementById('lista').innerHTML = '<p style="color:#facc15;text-align:center">Erro ao carregar catalogo/catalogo.json</p>';
  }
}
const esc = t => String(t==null?'':t).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function render(reset){
  if(reset){ MOSTRADOS = POR_PAGINA; document.getElementById('lista').innerHTML=''; }
  const lista = document.getElementById('lista');
  const slice = FILTRADOS.slice(0, MOSTRADOS);
  lista.innerHTML='';
  slice.forEach(p=>{
    const nome = p.nome||p.titulo||'Guia';
    const desc = p.promessa||p.descricao_oferta||p.descricao||'';
    const link = p.link_compra||p.link||'#';
    const preco = p.preco_texto || (p.preco? 'R$ '+String(p.preco).replace('.',',') : 'R$ 8,90');
    const div = document.createElement('div');
    div.className='card';
    div.innerHTML = `<div class="meta"><h3>${esc(nome)}</h3><span class="price">${esc(preco)}</span></div><div class="desc">${esc(desc)}</div><a class="btn" href="${esc(link)}" target="_blank" rel="noopener">COMPRAR AGORA</a>`;
    lista.appendChild(div);
  });
  const total = FILTRADOS.length;
  document.getElementById('contadorFiltro').textContent = total!==TODOS.length ? total+' encontrados' : '';
  const btn = document.getElementById('verMais');
  if(MOSTRADOS < total){ btn.style.display='block'; btn.textContent = `Ver mais ${Math.min(POR_PAGINA, total-MOSTRADOS)} ▼ (${MOSTRADOS}/${total})`; }
  else btn.style.display='none';
  if(total===0) lista.innerHTML='<p style="color:#71717a;text-align:center;padding:20px">Nenhum guia encontrado para essa busca.</p>';
}
document.getElementById('busca').addEventListener('input', e=>{
  const termo = e.target.value.toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
  if(!termo){ FILTRADOS = TODOS; render(true); return; }
  FILTRADOS = TODOS.filter(p=>{
    const texto = (p.nome+' '+(p.promessa||'')+' '+(p.publico||'')+' '+(p.tipo||'')).toLowerCase().normalize('NFD').replace(/[\u0300-\u036f]/g,'');
    return texto.includes(termo);
  });
  render(true);
});
document.getElementById('verMais').addEventListener('click', ()=>{
  MOSTRADOS += POR_PAGINA;
  render(false);
});
carregar();
</script>
</body>
</html>
