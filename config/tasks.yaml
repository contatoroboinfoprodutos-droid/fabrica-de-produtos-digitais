planejar_campanha:
  description: >
    Tema desta rodada: "{produto_topico}".
    PRODUTO DO CATÁLOGO (ele já existe; NÃO invente outro produto nem outro preço): {produto_catalogo}
    Planeje a campanha de venda desse produto. Use exatamente o NOME, o PRECO e a PROMESSA do catálogo
    e fale somente do que está em CONTEUDOS: não invente bônus, garantias, números, prazos nem depoimentos.
    Todos os produtos são criados com ajuda de IA e entregues prontos para uso.
    Regras: não prometa ganhos financeiros, lucro, primeira venda, resultado garantido nem cura, e não diga
    que algo foi testado ou comprovado; fale de benefícios realistas (tempo economizado, organização,
    aprendizado).
  expected_output: >
    Documento estratégico em markdown com a seção '### PRODUTO' contendo exatamente: NOME, TIPO,
    PRECO (ex.: R$ 7,00), PROMESSA (uma frase realista) e 3 a 5 CONTEUDOS (o que vem dentro).
    Depois: perfil do comprador, gancho de atenção e mensagem central da oferta.
  agent: conteudo_estrategista

criar_roteiro_e_legenda:
  description: >
    Com base no planejamento (use o NOME e o PRECO definidos em '### PRODUTO', sem alterá-los), crie:
    1. Um roteiro de áudio/locução curto (até 15 segundos) apresentando o produto e o preço.
    2. Sugestões de legendas intuitivas e dinâmicas que aparecem na tela acompanhando o áudio.
    3. Uma versão curta e pronta para publicação (2-3 frases) que sirva como legenda de
       Instagram e como post de Facebook. Mencione nome e preço. NÃO escreva hashtags nem links
       (não invente links nem cupons): o sistema acrescenta, em código, as hashtags em 3 camadas
       (amplas, do tema e de nicho) e a chamada de cada rede (link da bio no Instagram, bit.ly no Facebook).
    Separe claramente com os cabeçalhos '### ROTEIRO', '### LEGENDA_TELA' e '### TEXTO_PUBLICACAO'.
  expected_output: >
    Roteiro estruturado em blocos (Tempo, Áudio/Locução, Texto na Tela), seguido das seções
    '### ROTEIRO', '### LEGENDA_TELA' e '### TEXTO_PUBLICACAO'.
  agent: redator_senior
  context:
    - planejar_campanha

desenvolver_diretrizes_visuais:
  description: >
    Defina o conceito visual do anúncio para o produto definido no planejamento, incluindo a
    diretriz de um selo chamativo com o preço em destaque (use o PRECO definido, ex.: "R$ 7,00").
    IMPORTANTE: não invente nem sugira URL de imagem. A URL final da imagem JÁ ESTÁ DEFINIDA e é
    exatamente: {imagem_padrao_url}
    Use essa URL literalmente na seção IMAGEM_URL do output. A Meta Graph API só aceita uma URL
    pública real.
  expected_output: >
    Texto em markdown com duas seções: '### BRIEFING_VISUAL' (cena, paleta de cores e posição do
    selo de preço) e '### IMAGEM_URL' contendo exatamente a URL fornecida ({imagem_padrao_url}),
    sem alterações.
  agent: diretor_criativo
  context:
    - criar_roteiro_e_legenda

direcionar_para_grupos:
  description: >
    Com base no produto e no preço definidos no planejamento, indique o grupo ou canal ideal para
    divulgar este anúncio (ex.: grupos de achadinhos e promoções diárias para itens de R$ 7,00;
    grupos temáticos do nicho para ebooks; listas VIP para cursos de maior valor). Dê dicas de
    abordagem para a postagem no grupo e respeite as regras de cada grupo (sem spam).
  expected_output: >
    Plano de distribuição com: nome/tipo do grupo ideal, justificativa e o texto de introdução
    para fixar junto ao anúncio.
  agent: segmentador_publicos
  context:
    - planejar_campanha

publicar_no_facebook_e_instagram:
  description: >
    Usando o TEXTO_PUBLICACAO e a IMAGEM_URL definidos nas etapas anteriores:
    1. Chame a tool publish_to_facebook com message=TEXTO_PUBLICACAO e image_url=IMAGEM_URL.
    2. Chame a tool publish_to_instagram com image_url=IMAGEM_URL e caption=TEXTO_PUBLICACAO
       (ou a LEGENDA_TELA, se for mais adequada ao Instagram).
    Ao final, inclua o NOME e o PRECO do produto da rodada e um resumo de UMA linha do grupo/canal
    recomendado, para distribuição manual complementar (WhatsApp/Telegram).
    Reporte o resultado (sucesso com post_id, erro, ou "não configurado") de cada chamada,
    exatamente como retornado pelas tools. Não invente IDs nem resultados.
  expected_output: >
    Relatório final com: produto da rodada (nome e preço), status de publicação no Facebook e no
    Instagram (post_id, erro ou não configurado) e o grupo/canal recomendado para distribuição manual.
  agent: publicador_redes
  context:
    - planejar_campanha
    - criar_roteiro_e_legenda
    - desenvolver_diretrizes_visuais
    - direcionar_para_grupos
