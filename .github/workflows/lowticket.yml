name: Low Ticket (2 posts/dia)
on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 Brasília -> post de valor
    - cron: "0 22 * * *"   # 19:00 Brasília -> oferta R$7
  workflow_dispatch:
    inputs:
      slot:
        description: "manha ou tarde"
        default: "manha"
jobs:
  lowticket:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GROQ_MODEL: ${{ vars.GROQ_MODEL }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
      LT_DRY_RUN: ${{ vars.LT_DRY_RUN || 'true' }}
      LT_IG_USER_ID: ${{ secrets.LT_IG_USER_ID }}
      LT_IG_ACCESS_TOKEN: ${{ secrets.LT_IG_ACCESS_TOKEN }}
      LT_TIKTOK_ACCESS_TOKEN: ${{ secrets.LT_TIKTOK_ACCESS_TOKEN }}
      LT_PUBLIC_IMAGE_BASE_URL: ${{ vars.LT_PUBLIC_IMAGE_BASE_URL }}
      LT_OFFER_LINK: ${{ vars.LT_OFFER_LINK }}
      UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
      META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r infoprodutos_lowticket/requirements_lowticket.txt
      - name: Define o slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then S="${{ github.event.inputs.slot }}";
          elif [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then S=manha; else S=tarde; fi
          echo "SLOT=$S" >> $GITHUB_ENV
      - name: Escolhe o provedor de IA (Gemini, Groq ou OpenRouter)
        run: |
          # 1) Gemini (dois modelos). 2) Se falharem (429/503): Groq. 3) Depois: OpenRouter.
          PRIM="${GEMINI_MODEL:-gemini/gemini-3.8-flash}"; PRIM="${PRIM#gemini/}"
          ESCOLHIDO=""
          for M in "$PRIM" gemini-3.7-flash; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 40 \
              -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"ok"}]}],"generationConfig":{"maxOutputTokens":5}}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent")
            echo "Modelo $M respondeu HTTP $CODE"
            if [ "$CODE" = "200" ]; then ESCOLHIDO="$M"; break; fi
          done
          PROV=""
          if [ -n "$ESCOLHIDO" ]; then
            PROV=gemini
          else
            if [ -n "$GROQ_API_KEY" ]; then
              GCODE=$(curl -s -o /dev/null -w "%{http_code}" -m 40 https://api.groq.com/openai/v1/chat/completions \
                -H "Authorization: Bearer $GROQ_API_KEY" -H "Content-Type: application/json" \
                -d '{"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":"ok"}],"max_tokens":16}')
              echo "Groq respondeu HTTP $GCODE"
              if [ "$GCODE" = "200" ]; then PROV=groq; fi
            fi
            if [ -z "$PROV" ] && [ -n "$OPENROUTER_API_KEY" ]; then PROV=openrouter; fi
            if [ -z "$PROV" ]; then PROV=gemini; fi
            ESCOLHIDO="$PRIM"
          fi
          echo "Provedor escolhido: $PROV"
          echo "LT_LLM_PROVIDER=$PROV" >> $GITHUB_ENV
          echo "LT_LLM_MODEL=gemini/$ESCOLHIDO" >> $GITHUB_ENV

      - name: Executa o robô
        run: |
          # Em simulação (LT_DRY_RUN=true) tenta até 3 vezes, trocando de provedor se der 429 ou 503.
          # Em modo real faz uma tentativa só, para nunca duplicar uma postagem.
          P1="$LT_LLM_PROVIDER"; G1="$LT_LLM_MODEL"
          if [ "$G1" = "gemini/gemini-3.8-flash" ]; then G2="gemini/gemini-3.7-flash"; else G2="gemini/gemini-3.8-flash"; fi
          ORDER="$P1"
          for P in gemini groq openrouter gemini2; do
            [ "$P" = "$P1" ] && continue
            if [ "$P" = "groq" ] && [ -z "$GROQ_API_KEY" ]; then continue; fi
            if [ "$P" = "openrouter" ] && [ -z "$OPENROUTER_API_KEY" ]; then continue; fi
            ORDER="$ORDER $P"
          done
          if [ "${LT_DRY_RUN,,}" = "true" ]; then N=3; else N=1; fi
          for i in $(seq 1 $N); do
            PROV=$(echo $ORDER | cut -d' ' -f$i)
            if [ -z "$PROV" ]; then break; fi
            MOD="$G1"
            if [ "$PROV" = "gemini2" ]; then PROV=gemini; MOD="$G2"; fi
            export LT_LLM_PROVIDER="$PROV"; export LT_LLM_MODEL="$MOD"
            echo "Tentativa $i de $N com $PROV"
            python -m infoprodutos_lowticket.run_lowticket --slot $SLOT && exit 0
            echo "Tentativa $i de $N falhou."
            if [ $i -lt $N ]; then sleep 45; fi
          done
          exit 1
      - name: Guarda a imagem gerada (baixe na página da execução)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ env.SLOT }}
          path: output_lowticket/
          if-no-files-found: ignore
          retention-days: 7
