name: Low Ticket (2 posts/dia)
on:
  schedule:
    - cron: "0 12 * * *"   # 09:00 Brasília -> post de valor
    - cron: "0 22 * * *"   # 19:00 Brasília -> oferta R$7
  workflow_dispatch:
    inputs:
      slot:
        description: "manha ou tarde"
        default: "manha"
jobs:
  lowticket:
    runs-on: ubuntu-latest
    env:
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
      LT_LLM_PROVIDER: gemini
      LT_DRY_RUN: ${{ vars.LT_DRY_RUN || 'true' }}
      LT_IG_USER_ID: ${{ secrets.LT_IG_USER_ID }}
      LT_IG_ACCESS_TOKEN: ${{ secrets.LT_IG_ACCESS_TOKEN }}
      LT_TIKTOK_ACCESS_TOKEN: ${{ secrets.LT_TIKTOK_ACCESS_TOKEN }}
      LT_PUBLIC_IMAGE_BASE_URL: ${{ vars.LT_PUBLIC_IMAGE_BASE_URL }}
      LT_OFFER_LINK: ${{ vars.LT_OFFER_LINK }}
      UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
      META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
      FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
      INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.11" }
      - run: pip install -r infoprodutos_lowticket/requirements_lowticket.txt
      - name: Define o slot
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then S="${{ github.event.inputs.slot }}";
          elif [ "${{ github.event.schedule }}" = "0 12 * * *" ]; then S=manha; else S=tarde; fi
          echo "SLOT=$S" >> $GITHUB_ENV
      - name: Escolhe o modelo Gemini disponível
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
        run: |
          # Testa o modelo principal; se estiver sobrecarregado (503) ou sem cota (429), usa o reserva.
          PRIM="${GEMINI_MODEL:-gemini/gemini-3.8-flash}"; PRIM="${PRIM#gemini/}"
          ESCOLHIDO="$PRIM"
          for M in "$PRIM" gemini-3.7-flash; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 40 \
              -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"ok"}]}],"generationConfig":{"maxOutputTokens":5}}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent")
            echo "Modelo $M respondeu HTTP $CODE"
            if [ "$CODE" = "200" ]; then ESCOLHIDO="$M"; break; fi
          done
          echo "Usando gemini/$ESCOLHIDO"
          echo "GEMINI_ESCOLHIDO=gemini/$ESCOLHIDO" >> $GITHUB_ENV
          echo "LT_LLM_MODEL=gemini/$ESCOLHIDO" >> $GITHUB_ENV
      - name: Executa o robô
        run: |
          # Em simulação (LT_DRY_RUN=true) tenta até 3 vezes, alternando entre os dois modelos Gemini
          # se um estiver sobrecarregado (503). Em modo real faz uma tentativa só, para nunca duplicar uma postagem.
          M1="$LT_LLM_MODEL"
          if [ "$M1" = "gemini/gemini-3.8-flash" ]; then M2="gemini/gemini-3.7-flash"; else M2="gemini/gemini-3.8-flash"; fi
          if [ "${LT_DRY_RUN,,}" = "true" ]; then N=3; else N=1; fi
          for i in $(seq 1 $N); do
            if [ $((i % 2)) -eq 0 ]; then export LT_LLM_MODEL="$M2"; else export LT_LLM_MODEL="$M1"; fi
            echo "Tentativa $i de $N com $LT_LLM_MODEL"
            python -m infoprodutos_lowticket.run_lowticket --slot $SLOT && exit 0
            echo "Tentativa $i de $N falhou."
            [ $i -lt $N ] && sleep 60
          done
          exit 1
      - name: Guarda a imagem gerada (baixe na página da execução)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: card-${{ env.SLOT }}
          path: output_lowticket/
          if-no-files-found: ignore
          retention-days: 7
