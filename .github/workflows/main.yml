name: Executar Fabrica de Infoprodutos

on:
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub
  schedule:
    - cron: '0 17 * * *' # 1 vez ao dia (17h UTC = 14h Brasilia)

jobs:
  run-crew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Escolhe o provedor de IA (Gemini, Groq ou OpenRouter)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # 1) Gemini (dois modelos). 2) Se falharem (429/503): Groq. 3) Depois: OpenRouter.
          PRIM="${GEMINI_MODEL:-gemini/gemini-3.7-flash}"; PRIM="${PRIM#gemini/}"
          ESCOLHIDO=""
          for M in "$PRIM" gemini-3.8-flash; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 --connect-timeout 10 \
              -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"ok"}]}],"generationConfig":{"maxOutputTokens":5}}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent" || true)
            echo "Modelo $M respondeu HTTP $CODE"
            if [ "$CODE" = "200" ]; then ESCOLHIDO="$M"; break; fi
          done
          PROV=""
          if [ -n "$ESCOLHIDO" ]; then
            PROV=gemini
          else
            if [ -n "$GROQ_API_KEY" ]; then
              GCODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 --connect-timeout 10 https://api.groq.com/openai/v1/chat/completions \
                -H "Authorization: Bearer $GROQ_API_KEY" -H "Content-Type: application/json" \
                -d '{"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":"ok"}],"max_tokens":16}' || true)
              echo "Groq respondeu HTTP $GCODE"
              if [ "$GCODE" = "200" ]; then PROV=groq; fi
            fi
            if [ -z "$PROV" ] && [ -n "$OPENROUTER_API_KEY" ]; then PROV=openrouter; fi
            if [ -z "$PROV" ]; then PROV=gemini; fi
            ESCOLHIDO="$PRIM"
          fi
          echo "Provedor escolhido: $PROV"
          echo "PROVEDOR_ESCOLHIDO=$PROV" >> $GITHUB_ENV
          echo "GEMINI_ESCOLHIDO=gemini/$ESCOLHIDO" >> $GITHUB_ENV

      - name: Executar Pipeline Principal
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ env.PROVEDOR_ESCOLHIDO || secrets.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_ESCOLHIDO || secrets.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          MODEL: ${{ secrets.MODEL }}
          PRODUTO_TOPICO: ${{ secrets.PRODUTO_TOPICO }}
          IMAGEM_PADRAO_URL: ${{ secrets.IMAGEM_PADRAO_URL }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          BUSINESS_PORTFOLIO_ID: ${{ secrets.BUSINESS_PORTFOLIO_ID }}
          # Padrao seguro: simula (nao publica). Para publicar de verdade, crie o Secret DRY_RUN = false
          DRY_RUN: ${{ secrets.DRY_RUN || 'true' }}
        run: |
          # Em simulação, se der erro (429/503) tenta de novo com outro provedor (até 3 tentativas).
          # Em modo real faz uma tentativa só, para nunca duplicar uma postagem.
          P1="$LLM_PROVIDER"
          ORDER="$P1"
          for P in gemini groq openrouter; do
            [ "$P" = "$P1" ] && continue
            if [ "$P" = "groq" ] && [ -z "$GROQ_API_KEY" ]; then continue; fi
            if [ "$P" = "openrouter" ] && [ -z "$OPENROUTER_API_KEY" ]; then continue; fi
            ORDER="$ORDER $P"
          done
          if [ "${DRY_RUN,,}" = "true" ]; then N=3; else N=1; fi
          for i in $(seq 1 $N); do
            PROV=$(echo $ORDER | cut -d' ' -f$i)
            if [ -z "$PROV" ]; then break; fi
            export LLM_PROVIDER="$PROV"
            echo "Tentativa $i de $N com o provedor $PROV"
            python main.py && exit 0
            echo "Tentativa $i de $N falhou."
            if [ $i -lt $N ]; then sleep 30; fi
          done
          exit 1
