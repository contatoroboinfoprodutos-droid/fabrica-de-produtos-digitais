name: Executar Fabrica de Infoprodutos

on:
  workflow_dispatch: # Permite disparar manualmente pelo painel do GitHub
  schedule:
    - cron: '0 17 * * *' # 1 vez ao dia (17h UTC = 14h Brasilia)

jobs:
  run-crew:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout do Repositório
        uses: actions/checkout@v4

      - name: Configurar Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Instalar Dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Escolhe o provedor de IA (Gemini, Groq ou OpenRouter)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ secrets.GEMINI_MODEL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: |
          # 1) Gemini (dois modelos). 2) Se falharem (429/503): Groq. 3) Depois: OpenRouter.
          PRIM="${GEMINI_MODEL:-gemini/gemini-3.7-flash}"; PRIM="${PRIM#gemini/}"
          ESCOLHIDO=""
          for M in "$PRIM" gemini-3.8-flash; do
            CODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 --connect-timeout 10 \
              -H "x-goog-api-key: $GEMINI_API_KEY" -H "Content-Type: application/json" \
              -d '{"contents":[{"parts":[{"text":"ok"}]}],"generationConfig":{"maxOutputTokens":5}}' \
              "https://generativelanguage.googleapis.com/v1beta/models/$M:generateContent" || true)
            echo "Modelo $M respondeu HTTP $CODE"
            if [ "$CODE" = "200" ]; then ESCOLHIDO="$M"; break; fi
          done
          PROV=""
          if [ -n "$ESCOLHIDO" ]; then
            PROV=gemini
          else
            if [ -n "$GROQ_API_KEY" ]; then
              GCODE=$(curl -s -o /dev/null -w "%{http_code}" -m 30 --connect-timeout 10 https://api.groq.com/openai/v1/chat/completions \
                -H "Authorization: Bearer $GROQ_API_KEY" -H "Content-Type: application/json" \
                -d '{"model":"openai/gpt-oss-120b","messages":[{"role":"user","content":"ok"}],"max_tokens":16}' || true)
              echo "Groq respondeu HTTP $GCODE"
              if [ "$GCODE" = "200" ]; then PROV=groq; fi
            fi
            if [ -z "$PROV" ] && [ -n "$OPENROUTER_API_KEY" ]; then PROV=openrouter; fi
            if [ -z "$PROV" ]; then PROV=gemini; fi
            ESCOLHIDO="$PRIM"
          fi
          echo "Provedor escolhido: $PROV"
          echo "PROVEDOR_ESCOLHIDO=$PROV" >> $GITHUB_ENV
          echo "GEMINI_ESCOLHIDO=gemini/$ESCOLHIDO" >> $GITHUB_ENV

      - name: Executar Pipeline Principal
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          LLM_PROVIDER: ${{ env.PROVEDOR_ESCOLHIDO || secrets.LLM_PROVIDER || 'gemini' }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_MODEL: ${{ env.GEMINI_ESCOLHIDO || secrets.GEMINI_MODEL }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          OPENROUTER_MODEL: ${{ vars.OPENROUTER_MODEL }}
          GH_PAT_VARIABLES: ${{ secrets.GH_PAT_VARIABLES }}  # opcional: deixa o healer atualizar a Variable
          MODEL: ${{ secrets.MODEL }}
          PRODUTO_TOPICO: ${{ secrets.PRODUTO_TOPICO }}
          IMAGEM_PADRAO_URL: ${{ secrets.IMAGEM_PADRAO_URL }}
          UNSPLASH_API_KEY: ${{ secrets.UNSPLASH_API_KEY }}
          META_APP_ID: ${{ secrets.META_APP_ID }}
          META_APP_SECRET: ${{ secrets.META_APP_SECRET }}
          META_LONG_LIVED_TOKEN: ${{ secrets.META_LONG_LIVED_TOKEN }}
          FB_PAGE_ID: ${{ secrets.FB_PAGE_ID }}
          INSTAGRAM_ACCOUNT_ID: ${{ secrets.INSTAGRAM_ACCOUNT_ID }}
          BUSINESS_PORTFOLIO_ID: ${{ secrets.BUSINESS_PORTFOLIO_ID }}
          # Padrao seguro: simula (nao publica). Para publicar de verdade, crie o Secret DRY_RUN = false
          DRY_RUN: ${{ secrets.DRY_RUN || 'true' }}
        run: |
          # Até 3 tentativas, trocando de provedor de IA se der 429/503. Também em modo real: não há risco de
          # postar em duplicidade, porque cada rede que publica deixa uma marca (POST_MARKER_DIR) e uma nova
          # tentativa nunca repete a rede já publicada. Só repete se faltar rede e não houver bloqueio
          # definitivo (ex.: nenhum produto pronto no catálogo).
          export POST_MARKER_DIR="$RUNNER_TEMP/marcas"; rm -rf "$POST_MARKER_DIR"; mkdir -p "$POST_MARKER_DIR"
          export POST_REDES="facebook,instagram"
          P1="$LLM_PROVIDER"
          ORDER="$P1"
          for P in gemini groq openrouter; do
            [ "$P" = "$P1" ] && continue
            if [ "$P" = "groq" ] && [ -z "$GROQ_API_KEY" ]; then continue; fi
            if [ "$P" = "openrouter" ] && [ -z "$OPENROUTER_API_KEY" ]; then continue; fi
            ORDER="$ORDER $P"
          done
          REAL=true; if [ "${DRY_RUN,,}" = "true" ]; then REAL=false; fi
          N=3
          for i in $(seq 1 $N); do
            # se houver menos provedores que tentativas, a lista recomeça (melhor repetir um provedor do que desistir)
            COUNT=$(echo $ORDER | wc -w)
            PROV=$(echo $ORDER | cut -d' ' -f$(( (i - 1) % COUNT + 1 )))
            export LLM_PROVIDER="$PROV"
            echo "Tentativa $i de $N com o provedor $PROV"
            RC=0
            python main.py || RC=$?
            if [ "$REAL" = false ]; then
              if [ $RC -eq 0 ]; then exit 0; fi
            else
              ST=$(python -m fabrica_produtos marcas 2>/dev/null | head -1)
              echo "Situação das publicações: $ST"
              if [ "$ST" = "completo" ]; then exit 0; fi
              if [ "$ST" = "bloqueado" ]; then
                echo "::warning::Publicação bloqueada de propósito (veja o motivo acima). Nada a repetir."; exit 0
              fi
            fi
            echo "Tentativa $i de $N sem concluir."
            if [ $i -lt $N ]; then sleep 30; fi
          done
          if [ "$REAL" = true ]; then
            ST=$(python -m fabrica_produtos marcas 2>/dev/null | head -1)
            if [ "$ST" = "parcial" ]; then
              echo "::error::Só uma das redes publicou (Facebook ou Instagram). Confira as duas antes de rodar de novo."
            fi
          fi
          exit 1
