<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Fábrica de Produtos Digitais</title>
<style>
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0a0a;color:#fff;font-family:-apple-system,BlinkMacSystemFont,Inter,sans-serif;min-height:100vh;padding:18px}
.container{max-width:420px;margin:0 auto}
.badge{display:inline-block;background:#facc15;color:#000;font-weight:900;font-size:10px;padding:6px 10px;border-radius:6px;letter-spacing:.5px;margin-bottom:12px}
.tag{display:inline-block;background:#facc15;color:#000;font-weight:900;font-size:10px;padding:5px 12px;border-radius:999px;margin-bottom:10px}
.header h1{font-size:30px;font-weight:900;line-height:0.95;margin:10px 0;letter-spacing:-1px}
.header h1 span{color:#facc15}
.sub{color:#a1a1aa;font-size:13px;margin-bottom:18px}
.sub strong{color:#fff}
.products{display:flex;flex-direction:column;gap:12px}
.card{background:#141414;border:1px solid #232323;border-radius:18px;padding:16px}
.card h3{font-size:14px;font-weight:800;line-height:1.25;margin-bottom:6px}
.meta{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.price{border:1.5px solid #facc15;color:#facc15;font-size:11px;font-weight:800;padding:3px 9px;border-radius:999px}
.desc{color:#a1a1aa;font-size:12px;line-height:1.4;margin:8px 0 12px}
.btn{display:block;width:100%;background:#facc15;color:#000;text-align:center;font-weight:900;font-size:13px;padding:13px;border-radius:999px;text-decoration:none}
.footer{text-align:center;margin-top:22px;color:#52525b;font-size:10px;line-height:1.5}
</style>
</head>
<body>
<div class="container">
<div class="badge">FPD</div>
<div class="tag">TODOS EM PDF IMEDIATO</div>
<div class="header"><h1>FÁBRICA DE<br><span>PRODUTOS</span> DIGITAIS</h1><p class="sub"><strong>Escolha seu guia abaixo 👇</strong><br><span id="contador">Carregando catálogo...</span></p></div>
<div id="lista" class="products"></div>
<div class="footer">Pagamento seguro via Cakto • Entrega instantânea em PDF<br><br><span style="background:#facc15;color:#000;font-weight:900;padding:3px 7px;border-radius:5px">FPD</span> <strong style="color:#fff">FÁBRICA DE PRODUTOS DIGITAIS</strong></div>
</div>
<script>
async function load(){
  try{
    const r = await fetch('./catalogo/catalogo.json?v='+Date.now());
    if(!r.ok) throw new Error('erro catalogo');
    const data = await r.json();
    let produtos = [];
    if(Array.isArray(data)) produtos = data;
    else if(data.produtos && Array.isArray(data.produtos)) produtos = data.produtos;
    else if(data.pacotes && Array.isArray(data.pacotes)) produtos = data.pacotes;
    else if(data.links && Array.isArray(data.links)) produtos = data.links;
    
    produtos = produtos.filter(p=>p && (p.nome || p.titulo));
    // Ordena mais novos primeiro
    produtos.sort((a,b)=> new Date(b.criado_em||0) - new Date(a.criado_em||0));
    
    const lista = document.getElementById('lista');
    const cont = document.getElementById('contador');
    cont.textContent = produtos.length + (produtos.length===1?' guia disponível':' guias disponíveis') + ' • Atualizado automaticamente';
    lista.innerHTML='';
    produtos.forEach(p=>{
      const nome = p.nome || p.titulo || 'Guia';
      const desc = p.promessa || p.descricao_oferta || p.descricao || '';
      const link = p.link_compra || p.link || p.url || '#';
      const preco = p.preco_texto || (p.preco ? 'R$ '+String(p.preco).replace('.',',') : 'R$ 8,90');
      const id = p.id||'';
      const el = document.createElement('div');
      el.className='card';
      el.innerHTML = `<div class="meta"><h3>${nome}</h3><span class="price">${preco}</span></div><div class="desc">${desc.substring(0,120)}${desc.length>120?'...':''}</div><a class="btn" href="${link}" target="_blank" rel="noopener">COMPRAR AGORA</a>`;
      lista.appendChild(el);
    });
    if(produtos.length===0) lista.innerHTML='<p style="color:#a1a1aa;text-align:center">Nenhum produto ainda. Seu agente vai adicionar aqui.</p>';
  }catch(e){
    document.getElementById('lista').innerHTML='<p style="color:#facc15;text-align:center">Erro ao carregar catálogo. Verifique se catalogo/catalogo.json existe.</p>';
    console.error(e);
  }
}
load();
</script>
</body>
</html>
